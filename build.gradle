plugins {
    id 'base'
}

allprojects {
    group = 'de.selectiverender.plots'
    version = providers.gradleProperty('addon_version').get()
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        java.toolchain.languageVersion = JavaLanguageVersion.of(21)
    }
}

def platforms = [':paper-mc1.20.1', ':paper-mc1.21.1', ':fabric']
tasks.named('assemble') { dependsOn(platforms.collect { "$it:assemble" }) }
tasks.named('check') { dependsOn(platforms.collect { "$it:check" } + ':common:check') }
