name: SelectiveRenderPlotSquared
version: ${version}
main: de.selectiverender.plotsquared.SelectiveRenderPlotSquaredPlugin
api-version: '1.20'
depend: [PlotSquared]
authors: [cepreni-pengwing]
description: Sends exact PlotSquared regions to Selective Render clients.
commands:
  srp:
    description: Controls Selective Render for the PlotSquared plot under the player.
    usage: /srp <solo|refresh|off|status>
permissions:
  selectiverender.plot.solo:
    description: Allows using Selective Render PlotSquared commands.
    default: true
