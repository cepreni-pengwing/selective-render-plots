name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: selective-render-plots-jars
          path: |
            paper/mc*/build/libs/*.jar
            fabric/build/libs/*.jar

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^addon_version=//p' gradle.properties | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid addon_version '$version'" >&2; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v6
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        if: steps.version.outputs.exists == 'false'
      - if: steps.version.outputs.exists == 'false'
        run: ./gradlew build --stacktrace
      - name: Publish prerelease
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          mapfile -t assets < <(find paper/mc*/build/libs fabric/build/libs -maxdepth 1 -name '*.jar' | sort)
          test "${#assets[@]}" -eq 3
          previous=$(git describe --tags --abbrev=0 "$GITHUB_SHA" 2>/dev/null || true)
          if [[ -n "$previous" ]]; then
            printf '**Full Changelog**: [%s...%s](https://github.com/%s/compare/%s...%s)\n' "$previous" "$TAG" "$GITHUB_REPOSITORY" "$previous" "$TAG" > notes.md
          else
            printf '**Full Changelog**: [Commits](https://github.com/%s/commits/%s)\n' "$GITHUB_REPOSITORY" "$TAG" > notes.md
          fi
          gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md --prerelease
