plugins {
    id 'java'
}

def targetMinecraftVersion = providers.gradleProperty('target_minecraft_version').get()
def supportedPaperVersions = [
    '1.20.1': providers.gradleProperty('paper_version_1_20_1').get(),
    '1.21.1': providers.gradleProperty('paper_version_1_21_1').get()
]
def supportedApiVersions = [
    '1.20.1': '1.20',
    '1.21.1': '1.21.1'
]
def targetPaperVersion = supportedPaperVersions[targetMinecraftVersion]
if (targetPaperVersion == null) {
    throw new GradleException("Unsupported Paper Minecraft version: ${targetMinecraftVersion}")
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://maven.enginehub.org/repo/' }
}

dependencies {
    implementation project(':common')
    compileOnly "io.papermc.paper:paper-api:${targetPaperVersion}"
    compileOnly "com.intellectualsites.plotsquared:plotsquared-core:${project.plotsquared_version}@jar"
    compileOnly "com.intellectualsites.plotsquared:plotsquared-bukkit:${project.plotsquared_version}@jar"
    compileOnly 'com.sk89q.worldedit:worldedit-core:7.2.15'
}

configurations.compileClasspath {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'apiVersion', supportedApiVersions[targetMinecraftVersion]
    filesMatching('plugin.yml') {
        expand version: project.version, apiVersion: supportedApiVersions[targetMinecraftVersion]
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    archiveBaseName = "selective-render-plots-paper-mc${targetMinecraftVersion}"
    from project(':common').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
